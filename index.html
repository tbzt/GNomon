<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GNomon — atelier de trames</title>
    <meta
      name="description"
      content="Atelier d'écriture de jeu de rôle grandeur nature : réseau de personnages, trames, informations. 100 % local, aucune donnée transmise."
    />
    <link rel="stylesheet" href="css/gnomon.css" />
  </head>
  <body>
    <div class="barre">
      <p class="titre">GNomon</p>
      <nav class="modes" id="modes" aria-label="Moments de fabrication"></nav>
      <span class="spacer"></span>
      <span id="compteurs"></span>
      <button id="poids" class="poids" type="button" hidden></button>
      <button id="act-exporter" type="button">Exporter</button>
      <button id="act-importer" type="button">Importer</button>
      <input id="fichier-archive" type="file" accept="application/json,.json" hidden />
      <button id="act-seed" type="button">Jeu d'essai</button>
      <button id="act-vider" type="button">Vider</button>
    </div>

    <div class="sous-barre" id="sous-barre"></div>

    <p id="statut" hidden></p>

    <main>
      <div id="ecran-monde" hidden></div>
      <div id="ecran-reseau"></div>
      <div id="ecran-fiche" hidden></div>
      <div id="ecran-atelier" hidden></div>
      <div id="ecran-matrice" hidden></div>
      <div id="ecran-conscience" hidden></div>
      <div id="ecran-frise" hidden></div>
      <div id="ecran-casting" hidden></div>
      <div id="ecran-conduite" hidden></div>
      <div id="ecran-livrets" hidden></div>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>

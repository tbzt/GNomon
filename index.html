<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GNomon — atelier de trames</title>
    <meta
      name="description"
      content="Atelier d'écriture de jeu de rôle grandeur nature : réseau de personnages, trames, informations. 100 % local, aucune donnée transmise."
    />
    <link rel="stylesheet" href="css/gnomon.css" />
  </head>
  <body>
    <div class="barre">
      <p class="titre">GNomon</p>
      <button id="act-retour" type="button" hidden>← Le réseau</button>
      <span id="fil" class="baseline">Le réseau</span>
      <span class="spacer"></span>
      <span id="compteurs"></span>
      <button id="act-trames" type="button">Les trames</button>
      <button id="act-infos" type="button">Qui sait quoi</button>
      <button id="act-temps" type="button">Le temps</button>
      <button id="act-conscience" type="button">Conscience</button>
      <button id="act-nouveau" type="button">Nouveau</button>
      <button id="act-seed" type="button">Jeu d'essai</button>
      <button id="act-vider" type="button">Vider</button>
    </div>

    <p id="statut" hidden></p>

    <main>
      <div id="ecran-reseau"></div>
      <div id="ecran-fiche" hidden></div>
      <div id="ecran-atelier" hidden></div>
      <div id="ecran-matrice" hidden></div>
      <div id="ecran-conscience" hidden></div>
      <div id="ecran-frise" hidden></div>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
